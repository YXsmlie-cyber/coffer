# PH115 远程访问片段（可选功能，默认不启用）。
# 用法：include 进现有 HTTPS server 块；先把下面的 /ph115 前缀与 htpasswd 路径换成你自己的值。
# 安全前提：应用只监听 127.0.0.1 且 proxy_headers=False；Nginx 仅在登录接口校验一次 Basic Auth，
#           随后清空 Authorization，由后端签发 HttpOnly 签名 Cookie 维持会话。
# 注意：本片段只服务反向代理，SSH 隧道与密钥不在本仓库内。
# 仅由现有 HTTPS server 块 include；不创建或占用新监听端口。
location = /ph115 {
    return 302 /ph115/;
}

# 应用内登录表单把 Basic Authorization 只发到这个精确接口。
# Nginx 用原有 htpasswd 校验成功后才转发，并在转发前清空 Authorization，
# 所以应用进程永远接触不到账号密码。
location = /ph115/api/remote-auth/login {
    auth_basic "PH115 Remote Access";
    auth_basic_user_file /etc/nginx/.htpasswd-ph115;
    auth_delay 500ms;
    error_page 401 = @ph115_login_denied;

    proxy_pass http://127.0.0.1:18000/api/remote-auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /ph115;
    proxy_set_header X-PH115-Remote 1;
    proxy_set_header X-PH115-Auth-Verified 1;
    proxy_set_header Authorization "";
    proxy_buffering off;
}

# 把 Basic Auth 失败转换为普通 JSON，避免浏览器再次弹原生认证框。
location @ph115_login_denied {
    auth_basic off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    # 最终响应使用 403，彻底避免浏览器把它识别成 Basic Auth 挑战并弹原生框。
    return 403 '{"detail":"账号或密码不正确","code":"REMOTE_LOGIN_FAILED"}';
}

location ^~ /ph115/ {
    # 其余请求不再使用 Basic Auth；后端验证 HttpOnly 签名会话。
    # 结尾斜杠会移除 /ph115/ 前缀，使后端继续收到原生 /api、/ws 路径。
    proxy_pass http://127.0.0.1:18000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /ph115;
    proxy_set_header X-PH115-Remote 1;
    proxy_set_header X-PH115-Auth-Verified "";
    proxy_set_header Authorization "";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
